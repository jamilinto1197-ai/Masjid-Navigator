name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["security-hardening"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish debug APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      FIREBASEANDROIDAPPID: ${{ vars.FIREBASEANDROIDAPPID || secrets.FIREBASEANDROIDAPPID || vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASEWEBCLIENTID: ${{ vars.FIREBASEWEBCLIENTID || secrets.FIREBASEWEBCLIENTID || vars.FIREBASE_WEB_CLIENT_ID || secrets.FIREBASE_WEB_CLIENT_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASEANDROIDAPPID || secrets.FIREBASEANDROIDAPPID || vars.FIREBASE_ANDROID_APP_ID || secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASEWEBCLIENTID || secrets.FIREBASEWEBCLIENTID || vars.FIREBASE_WEB_CLIENT_ID || secrets.FIREBASE_WEB_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.11.1"

      - name: Validate Firebase Android configuration
        run: gradle --no-daemon -p android :app:checkFirebaseAndroidConfig --console=plain

      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug --stacktrace --console=plain

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Masjid-Navigator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish persistent APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.1.1-build${GITHUB_RUN_NUMBER}"
          APK="android/app/build/outputs/apk/debug/MasjidPH-Navigator-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="$(printf 'versionCode: %s\n\nAutomated debug build from commit %s. This is a development build, not a production-signed release.' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "MasjidPH Navigator ${TAG}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

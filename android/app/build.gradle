plugins {
    id 'com.android.application'
}

def firebaseAndroidAppId = providers.gradleProperty("firebaseAndroidAppId")
        .orElse(providers.environmentVariable("FIREBASE_ANDROID_APP_ID"))
        .getOrElse("")
def firebaseWebClientId = providers.gradleProperty("firebaseWebClientId")
        .orElse(providers.environmentVariable("FIREBASE_WEB_CLIENT_ID"))
        .getOrElse("")

android {
    namespace "com.masjidph.navigator"
    compileSdk 35

    defaultConfig {
        applicationId "com.masjidph.navigator"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.1.0-native"
        resValue "string", "firebase_android_app_id", firebaseAndroidAppId
        resValue "string", "default_web_client_id", firebaseWebClientId
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Lock resolved dependencies during the security workflow so OSV-Scanner can
// inspect the exact versions selected for this build.
dependencyLocking {
    lockAllConfigurations()
}

tasks.register("resolveAllDependenciesForSecurity") {
    doLast {
        configurations.findAll { it.canBeResolved }.each { configuration ->
            configuration.resolve()
        }
    }
}

tasks.register("checkFirebaseAndroidConfig") {
    doLast {
        if (!(firebaseAndroidAppId ==~ /^1:885467340998:android:[0-9a-fA-F]+$/)) {
            throw new GradleException(
                "Firebase Android app ID is missing or invalid. Register package com.masjidph.navigator in Firebase and set FIREBASE_ANDROID_APP_ID (or -PfirebaseAndroidAppId) to its mobilesdk_app_id."
            )
        }
        if (!(firebaseWebClientId ==~ /^[0-9]+-[A-Za-z0-9-]+\.apps\.googleusercontent\.com$/)) {
            throw new GradleException(
                "Google OAuth web client ID is missing or invalid. Set FIREBASE_WEB_CLIENT_ID (or -PfirebaseWebClientId) to the project's Web application OAuth client ID."
            )
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}

plugins {
    id 'com.android.application'
}

android {
    namespace "com.masjidph.navigator"
    compileSdk 35
    defaultConfig {
        applicationId "com.masjidph.navigator"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        debug { }
        release { minifyEnabled false; shrinkResources false }
    }
}

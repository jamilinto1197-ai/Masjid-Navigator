name: Build MasjidPH Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'www/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasjidPH-Navigator-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK into repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/*.apk downloads/MasjidPH-Navigator-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/MasjidPH-Navigator-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to commit."
          else
            git commit -m "Publish latest Android debug APK"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
name: Android security gate

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "scripts/**"
      - "tests/**"
      - "firebase.json"
      - ".github/workflows/**"
      - "README.md"
      - "package.json"
      - "firestore.rules"
  pull_request:
    paths:
      - "android/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
      - "package.json"
      - "firestore.rules"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: android-security-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID }}

jobs:
  android-security:
    name: Static analysis, dependency audit, and APK checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Python for MobSF source scan
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node for Firestore rules validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned MobSF scanner
        run: python -m pip install --disable-pip-version-check "mobsfscan==1.0.1"

      - name: Scan first-party Android source
        id: mobsfscan
        continue-on-error: true
        run: |
          mkdir -p build/reports/security
          mobsfscan --type android --json -o build/reports/security/mobsfscan.json \
            android/app/src/main/java \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/res

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.34.1

      - name: Install pinned Firestore rules test dependencies
        run: npm install --prefix /tmp/firestore-tests --no-save --package-lock=false firebase@12.19.0 @firebase/rules-unit-testing@5.0.2

      - name: Prepare Firestore rules test
        run: cp tests/firestore-rules.test.mjs /tmp/firestore-tests/firestore-rules.test.mjs

      - name: Compile Firestore rules and run authorization tests
        id: firestore_rules
        continue-on-error: true
        run: firebase emulators:exec --project demo-masjidph --only firestore "node /tmp/firestore-tests/firestore-rules.test.mjs"

      - name: Set up Go for OSV-Scanner
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"

      - name: Install pinned OSV-Scanner
        run: |
          # Retry transient checksum/database transport failures without disabling Go's module verification.
          for attempt in 1 2 3; do
            if go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "OSV-Scanner install failed on attempt $attempt; retrying in 5 seconds."
              sleep 5
            fi
          done
          exit 1

      - name: Build, lint, and resolve all Android dependencies
        id: android_build
        continue-on-error: true
        run: |
          gradle --no-daemon --write-locks -p android \
            :app:clean \
            :app:resolveAllDependenciesForSecurity \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            --stacktrace --console=plain

      - name: Verify generated Gradle dependency lock
        id: lock_check
        if: always()
        continue-on-error: true
        run: |
          test -s android/app/gradle.lockfile || {
            echo "::error::No resolved Gradle lockfile was generated; dependency audit cannot be considered complete."
            exit 1
          }

      - name: Scan locked dependencies for known vulnerabilities
        id: osv_scan
        if: always()
        continue-on-error: true
        run: |
          if [[ -s android/app/gradle.lockfile ]]; then
            "$(go env GOPATH)/bin/osv-scanner" scan source -r .
          else
            echo "::error::Skipping OSV audit because no Gradle lockfile exists."
            exit 1
          fi

      - name: Inspect compiled APK permissions, signature, and contents
        id: apk_check
        if: always()
        continue-on-error: true
        run: bash scripts/check-apk-security.sh

      - name: Require a real Firebase Android configuration
        id: firebase_check
        if: always()
        continue-on-error: true
        run: gradle --no-daemon -p android :app:checkFirebaseAndroidConfig --console=plain

      - name: Enforce security gate results
        if: always()
        env:
          SOURCE_SCAN: ${{ steps.mobsfscan.outcome }}
          BUILD_SCAN: ${{ steps.android_build.outcome }}
          LOCK_SCAN: ${{ steps.lock_check.outcome }}
          OSV_SCAN: ${{ steps.osv_scan.outcome }}
          APK_SCAN: ${{ steps.apk_check.outcome }}
          FIREBASE_SCAN: ${{ steps.firebase_check.outcome }}
          RULES_SCAN: ${{ steps.firestore_rules.outcome }}
        run: |
          failed=0
          for item in "MobSF source scan:$SOURCE_SCAN" "Android build/lint:$BUILD_SCAN" "Gradle lock generation:$LOCK_SCAN" "OSV dependency audit:$OSV_SCAN" "APK inspection:$APK_SCAN" "Firebase Android configuration:$FIREBASE_SCAN" "Firestore rules compilation:$RULES_SCAN"; do
            name="${item%%:*}"
            result="${item#*:}"
            printf '%s => %s\n' "$name" "$result"
            if [[ "$result" != "success" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Security gate failed. No APK is being published."
            exit 1
          fi

      - name: Upload security reports only (never the APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-security-reports
          path: |
            build/reports/security/**
            android/app/gradle.lockfile
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

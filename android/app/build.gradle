plugins {
    id 'com.android.application'
}

def configValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).orElse("").get()
}
def buildConfigString = { String name ->
    def value = configValue(name).replace("\\", "\\\\").replace('"', '\\"')
    return '"' + value + '"'
}

android {
    namespace "com.masjidph.navigator"
    compileSdk 35
    defaultConfig {
        applicationId "com.masjidph.navigator"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0.0-native"

        buildConfigField "String", "FIREBASE_API_KEY", buildConfigString("FIREBASE_API_KEY")
        buildConfigField "String", "FIREBASE_APP_ID", buildConfigString("FIREBASE_APP_ID")
        buildConfigField "String", "FIREBASE_PROJECT_ID", buildConfigString("FIREBASE_PROJECT_ID")
        buildConfigField "String", "FIREBASE_MESSAGING_SENDER_ID", buildConfigString("FIREBASE_MESSAGING_SENDER_ID")
        buildConfigField "String", "FIREBASE_STORAGE_BUCKET", buildConfigString("FIREBASE_STORAGE_BUCKET")
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", buildConfigString("GOOGLE_WEB_CLIENT_ID")
    }
    buildTypes {
        debug { }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
